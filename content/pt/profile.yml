about:
  intro: Frontend Engineer focado em produtos web que precisam continuar evoluindo sem perder consistência.
  paragraphs:
    - No dia a dia, trabalho com Vue, Nuxt e TypeScript. Construo interfaces e Design Systems, integro APIs e escrevo testes.
    - Já vi de perto o que acontece quando um produto cresce rápido e a mesma tela passa a ser feita de jeitos diferentes. Por isso dou atenção a componentes bem definidos, regras claras e conversa cedo com Design e Backend.
    - Fora do trabalho, construo meus próprios produtos de ponta a ponta, do código ao deploy.

