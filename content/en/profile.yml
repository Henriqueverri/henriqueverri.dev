hero:
  status: Open to new opportunities
  lead: Frontend Engineer · Vue, Nuxt and TypeScript

about:
  intro: Frontend Engineer focused on web products that need to keep evolving without losing consistency.
  paragraphs:
    - Day to day, I work with Vue, Nuxt and TypeScript. I build interfaces and Design Systems, integrate APIs and write tests.
    - I've seen up close what happens when a product grows fast and the same screen ends up built in different ways. That's why I care about well-defined components, clear rules and talking early with Design and Backend.
    - Outside work, I build my own products end to end, from code to deploy.

